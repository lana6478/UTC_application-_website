<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Liquid Field</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: crosshair;
        }

        #screen {
            white-space: pre;
            line-height: 0.9;
            letter-spacing: 1px;
            user-select: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="screen"></div>

    <script>
        const container = document.getElementById('screen');
        const chars = " .:-=+*#%@";
        
        let cols, rows;
        let mouseX = -1000;
        let mouseY = -1000;
        let time = 0;

        function updateLayout() {
            cols = Math.floor(window.innerWidth / 10);
            rows = Math.floor(window.innerHeight / 14);
        }

        window.addEventListener('resize', updateLayout);
        window.onmousemove = (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        };

        function animate() {
            time += 0.03;
            let output = "";

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const px = x * 10;
                    const py = y * 14;

                    // 1. THE RANDOM FIELD (Background Waves)
                    // We layer three different sine waves to simulate "random" interference
                    const noise = 
                        Math.sin(x * 0.1 + time) + 
                        Math.cos(y * 0.1 + time * 0.5) + 
                        Math.sin((x + y) * 0.05 + time * 0.8);
                    
                    // 2. THE MOUSE INTERACTION (The Warp)
                    const dx = mouseX - px;
                    const dy = mouseY - py;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // Create a "pulse" that radiates from the mouse
                    const mouseForce = Math.exp(-dist / 100) * 10;
                    const ripple = Math.sin(dist * 0.2 - time * 5) * mouseForce;

                    // Combine them
                    const totalInfluence = (noise + ripple) + 2; // Offset to keep it positive
                    
                    // Map to character index
                    let charIdx = Math.floor((totalInfluence / 5) * chars.length);
                    
                    // Clamp values
                    charIdx = Math.max(0, Math.min(chars.length - 1, charIdx));
                    
                    output += chars[charIdx];
                }
                output += "\n";
            }

            container.textContent = output;
            requestAnimationFrame(animate);
        }

        updateLayout();
        animate();
    </script>
</body>
</html>
