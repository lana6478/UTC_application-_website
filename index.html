<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Fluid Field</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: none; /* Mouse is invisible, only its impact is seen */
        }

        #screen {
            white-space: pre;
            line-height: 0.85;
            letter-spacing: 0px;
            user-select: none;
            font-size: 12px;
            color: #ddd; /* Slightly dimmed for a grittier look */
        }
    </style>
</head>
<body>

    <div id="screen"></div>

    <script>
        const container = document.getElementById('screen');
        // Dense character set for a "filled in" look
        const chars = " .:-=+*#%@#%*+=-:. "; 
        
        let cols, rows;
        let mouseX = -1000;
        let mouseY = -1000;
        let time = 0;

        function updateLayout() {
            cols = Math.floor(window.innerWidth / 8);
            rows = Math.floor(window.innerHeight / 12);
        }

        window.addEventListener('resize', updateLayout);
        window.onmousemove = (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        };

        function animate() {
            time += 0.005; // Extremely slow background drift
            let output = "";

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const px = x * 8;
                    const py = y * 12;

                    // 1. DENSE SLOW BACKGROUND
                    // Using multiple layers of slow sines for a "thick" look
                    const bgBase = 
                        Math.sin(x * 0.05 + time) * Math.cos(y * 0.05 + time * 0.5);
                    
                    // 2. MOUSE INTERACTION (Displacement)
                    const dx = mouseX - px;
                    const dy = mouseY - py;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // The mouse "pushes" the wave phase
                    // We don't add brightness, we just warp the background calculation
                    const push = Math.exp(-dist / 80) * 10;
                    
                    // Combine the drift with the mouse "dent"
                    const finalValue = Math.sin(bgBase * 5 + push);

                    // Map to characters (shifting index based on the "push")
                    let charIdx = Math.floor(((finalValue + 1) / 2) * (chars.length - 1));
                    
                    output += chars[charIdx];
                }
                output += "\n";
            }

            container.textContent = output;
            requestAnimationFrame(animate);
        }

        updateLayout();
        animate();
    </script>
</body>
</html>
