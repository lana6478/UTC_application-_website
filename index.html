<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Static Warp</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: none;
        }

        #screen {
            white-space: pre;
            line-height: 0.9;
            letter-spacing: 1px;
            user-select: none;
            font-size: 14px;
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="screen"></div>

    <script>
        const container = document.getElementById('screen');
        const chars = " .:-=+*#%@";
        
        let cols, rows;
        let mouseX = -1000;
        let mouseY = -1000;
        let targetX = -1000;
        let targetY = -1000;

        function updateLayout() {
            cols = Math.floor(window.innerWidth / 10);
            rows = Math.floor(window.innerHeight / 14);
        }

        window.addEventListener('resize', updateLayout);
        window.onmousemove = (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        };

        function animate() {
            // Smoothly interpolate mouse position for a "heavy" liquid feel
            mouseX += (targetX - mouseX) * 0.1;
            mouseY += (targetY - mouseY) * 0.1;

            let output = "";

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const px = x * 10;
                    const py = y * 14;

                    // Calculate distance to mouse
                    const dx = mouseX - px;
                    const dy = mouseY - py;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // STATIC FIELD: A subtle pattern that doesn't move on its own
                    // Using a modulo and coordinate check to create a faint grid
                    let baseValue = (x % 4 === 0 && y % 2 === 0) ? 1 : 0;

                    // MOUSE DISTORTION:
                    // This creates a "pinch" or "magnification" effect
                    const radius = 200;
                    let distortion = 0;
                    
                    if (dist < radius) {
                        // Creates a bell-curve intensity based on mouse proximity
                        distortion = Math.cos((dist / radius) * (Math.PI / 2)) * 8;
                    }

                    // Map the combination of the static grid + mouse warp to the ASCII set
                    let charIdx = Math.floor(baseValue + distortion);
                    
                    // Clamp to the length of our character string
                    charIdx = Math.max(0, Math.min(chars.length - 1, charIdx));
                    
                    output += chars[charIdx];
                }
                output += "\n";
            }

            container.textContent = output;
            requestAnimationFrame(animate);
        }

        updateLayout();
        animate();
    </script>
</body>
</html>
