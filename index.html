<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTC_application_showcase</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: none;
        }

        #screen {
            white-space: pre;
            line-height: 0.75; /* Tighter vertical spacing */
            letter-spacing: -1px;
            user-select: none;
            font-size: 11px;
            color: #eee;
        }
    </style>
</head>
<body>

    <div id="screen"></div>

    <script>
        const container = document.getElementById('screen');
        // Dense character string for deep texture
        const chars = " .:-=+*#%@@#%*+=-:. "; 
        
        let cols, rows;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let time = 0;

        function updateLayout() {
            cols = Math.floor(window.innerWidth / 7);
            rows = Math.floor(window.innerHeight / 11);
        }

        window.addEventListener('resize', updateLayout);
        window.onmousemove = (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        };

        function animate() {
            time += 0.003; // Base crawl speed
            
            // Smooth easing for the "physics" feel
            mouseX += (targetX - mouseX) * 0.08;
            mouseY += (targetY - mouseY) * 0.08;

            let output = "";

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const px = x * 7;
                    const py = y * 11;

                    // 1. CALCULATE DISTANCE
                    const dx = mouseX - px;
                    const dy = mouseY - py;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // 2. INTENSE WARP LOGIC
                    // We use a high multiplier (25) to physically shift the 
                    // character lookup coordinates based on mouse distance.
                    const warpStrength = Math.exp(-dist / 200) * 25;
                    
                    // Calculate "displaced" coordinates
                    const displacedX = x + (dx / (dist + 1)) * warpStrength;
                    const displacedY = y + (dy / (dist + 1)) * warpStrength;

                    // 3. BACKGROUND TURBULENCE
                    // Use the displaced coordinates to look up the background noise
                    const val = 
                        Math.sin(displacedX * 0.1) * Math.cos(displacedY * 0.1 + time) + 
                        Math.sin((displacedX + displacedY) * 0.05 - time * 0.5);

                    // 4. MAP TO ASCII
                    let charIdx = Math.floor(((val + 1.5) / 3) * (chars.length - 1));
                    charIdx = Math.max(0, Math.min(chars.length - 1, charIdx));
                    
                    output += chars[charIdx];
                }
                output += "\n";
            }

            container.textContent = output;
            requestAnimationFrame(animate);
        }

        updateLayout();
        animate();
    </script>
</body>
</html>
